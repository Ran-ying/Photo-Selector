name: PHP regression

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-gd
      - name: Check runtime and syntax
        run: |
          php -v
          php -m | grep -qi 'pdo_sqlite'
          php -m | grep -qi 'gd'
          php -m | grep -qi 'fileinfo'
          php -l index.php
          git diff --check "$(git rev-list --max-parents=0 HEAD)" HEAD
      - name: Isolated API regressions
        run: python3 -m unittest discover -s tests -v
